<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sentence Runner</title>
<style>
:root{
  --bg:#14112e; --panel:#211c4a; --panel2:#2d2763; --ink:#fff8e8; --mute:#b9b3e6;
  --acc:#ffb020; --good:#47d27a; --bad:#ff5d6c; --line:#4a4290;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{background:linear-gradient(#1b1640,#241e55);border-bottom:3px solid var(--line);padding:8px 14px 10px;flex:none}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.stat{font-size:15px;font-weight:700;white-space:nowrap}
.stat b{font-size:19px;color:var(--acc);font-variant-numeric:tabular-nums}
#hLives{color:#ff6b7d;letter-spacing:2px;font-size:19px}
#hCombo{color:#7cf0ff;min-width:64px}
.sp{flex:1}
.hbtn{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:5px 11px;font-size:14px;font-weight:700}
.hbtn:hover{border-color:var(--acc)}
.hbtn:disabled{opacity:.4;cursor:default}
#hKo{font-size:clamp(17px,2.3vw,24px);font-weight:800;margin:8px 0 6px;line-height:1.35;min-height:1.35em}
#hSlots{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:36px}
.slot{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 10px;border-radius:9px;
  border:2px dashed #6d64c4;color:#ffe9a8;font-weight:800;font-size:clamp(15px,1.8vw,19px);font-family:"Segoe UI",system-ui,sans-serif}
.slot.cur{border-color:var(--acc);animation:pulse 1s infinite}
.slot.ok{border:2px solid var(--good);background:rgba(71,210,122,.16);color:#d8ffe5}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,176,32,.28)}}

/* ---------- stage ---------- */
#stagewrap{position:relative;flex:1;min-height:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#center .big{font-size:clamp(60px,12vw,130px);font-weight:900;color:#fff;text-shadow:0 5px 0 #0006,0 0 30px #ffb02088}
#center .small{font-size:clamp(14px,1.8vw,20px);font-weight:700;margin-top:6px;background:#0008;padding:6px 14px;border-radius:999px}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;transition:.25s;pointer-events:none;
  background:#10331de8;border:2px solid var(--good);border-radius:14px;padding:10px 18px;text-align:center;max-width:92%;
  font-family:"Segoe UI",system-ui,sans-serif}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .en{font-size:clamp(16px,2vw,22px);font-weight:800}
#toast .pt{color:#ffe28a;font-weight:800;font-size:14px;margin-top:2px}
#toast.warn{background:#3a1119e8;border-color:var(--bad)}
#foot{flex:none;background:#0d0b24;color:var(--mute);font-size:13px;padding:5px 14px;text-align:center;border-top:2px solid var(--line)}
kbd{background:#3a3380;border-radius:5px;padding:1px 6px;color:#fff;font-size:12px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(9,8,28,.78);padding:12px;z-index:5}
.screen.on{display:flex}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:16px 22px;max-width:960px;width:100%;
  max-height:96vh;overflow:auto;box-shadow:0 18px 50px #0008}
.panel.narrow{max-width:620px}
h1{margin:0;font-size:clamp(28px,4.4vw,44px);letter-spacing:.5px;color:var(--acc);text-shadow:0 3px 0 #0006;font-family:"Segoe UI",system-ui,sans-serif}
h2{margin:0 0 10px;font-size:26px}
.sub{color:var(--mute);margin:2px 0 8px;font-size:14px}
.seg{display:flex;gap:8px;margin:6px 0 2px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 6px;font-weight:800;font-size:16px}
.seg button.on{background:var(--acc);color:#2a1d00;border-color:#ffd978}
.dd{color:var(--mute);font-size:13px;min-height:18px;margin:2px 0 6px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:6px 0 10px}
.card{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card .t{font-weight:900;font-size:19px}
.card .d{color:var(--mute);font-size:12.5px;margin:1px 0 5px;min-height:32px}
.card .s{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.star{color:#ffd24a;letter-spacing:2px}
.star .off{color:#5a5496}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--acc);color:#2a1d00;border:0;border-radius:12px;padding:10px 20px;font-weight:900;font-size:17px;box-shadow:0 4px 0 #b57400}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b57400}
.btn.g{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #14102f;border:2px solid var(--line)}
.tg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0;align-items:center}
.tg button{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700;font-size:14px}
.tg button.on{border-color:var(--good);background:rgba(71,210,122,.2)}
.how{background:#17133a;border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.55;margin:4px 0 6px;color:#e4defa}
.how b{color:var(--acc)}
.res{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px}
.res div{background:var(--panel2);border-radius:12px;padding:8px 16px;font-size:14px;color:var(--mute)}
.res b{display:block;font-size:24px;color:var(--ink)}
.bigstars{font-size:46px;letter-spacing:6px}
.rvl{max-height:34vh;overflow:auto;border-radius:12px;background:#17133a;padding:6px 10px}
.rv{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #342d70}
.rv:last-child{border:0}
.rv .tx{flex:1}
.rv .en{font-weight:800;font-family:"Segoe UI",system-ui,sans-serif;font-size:16px}
.rv .ko{color:var(--mute);font-size:13.5px}
.rv .lk{color:#6d68a8;font-style:italic}
.say{background:var(--panel2);border:2px solid var(--line);border-radius:9px;padding:3px 9px}
.libh{margin:14px 0 4px;color:var(--acc);font-weight:900}
@media (max-height:640px){#hud{padding:5px 12px 6px}#hKo{margin:4px 0 4px}.slot{height:30px}#foot{padding:3px}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <div class="badge" id="hStage">Stage</div>
      <div class="stat" id="hLives"></div>
      <div class="stat">점수 <b id="hScore">0</b></div>
      <div class="stat" id="hCombo"></div>
      <div class="sp"></div>
      <button class="hbtn" id="bHint">💡 힌트 <span id="hHint">3</span></button>
      <button class="hbtn" id="bSound" title="효과음">🔊</button>
      <button class="hbtn" id="bPause">⏸ 일시정지</button>
    </div>
    <div id="hKo"></div>
    <div id="hSlots"></div>
  </header>

  <div id="stagewrap">
    <canvas id="cv"></canvas>
    <div id="center"></div>
    <div id="toast"></div>

    <!-- 메인 메뉴 -->
    <div class="screen on" id="sMenu"><div class="panel">
      <h1>🏃 Sentence Runner</h1>
      <div class="sub">달리면서 문장을 완성하라! · 공통영어2 Lesson 3~4</div>
      <b>난이도</b>
      <div class="seg" id="diffSeg"></div>
      <div class="dd" id="diffDesc"></div>
      <b>스테이지 선택</b>
      <div class="stages" id="stageCards"></div>
      <div class="how" id="howBox"></div>
      <div class="tg"><span id="menuToggles" class="tg" style="margin:0"></span><button class="btn g" id="bLib" style="font-size:14px;padding:6px 14px;box-shadow:none">📚 완성한 문장 모음</button></div>
    </div></div>

    <!-- 일시정지 -->
    <div class="screen" id="sPause"><div class="panel narrow">
      <h2>⏸ 일시정지</h2>
      <div class="tg" id="pauseToggles"></div>
      <div class="btns">
        <button class="btn" id="pResume">계속하기</button>
        <button class="btn g" id="pRestart">처음부터 다시</button>
        <button class="btn g" id="pMenu">메뉴로</button>
      </div>
    </div></div>

    <!-- 결과 -->
    <div class="screen" id="sResult"><div class="panel narrow" id="resultBox"></div></div>

    <!-- 문장 모음 -->
    <div class="screen" id="sLib"><div class="panel">
      <h2>📚 완성한 문장 모음</h2>
      <div class="sub">게임에서 완성한 문장이 여기에 쌓여요. 🔊를 누르면 영어로 읽어 줘요.</div>
      <div class="rvl" id="libList" style="max-height:62vh"></div>
      <div class="btns"><button class="btn" id="libBack">돌아가기</button></div>
    </div></div>
  </div>

  <div id="foot"><kbd>Space</kbd> / <kbd>↑</kbd> 점프 (공중에서 한 번 더 누르면 더 높이!) · <kbd>H</kbd> 힌트 · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리 · 화면을 터치/클릭해도 점프해요</div>
</div>

<script>
/* ====================================================================
 *  교사용 설정 (여기만 고치면 됩니다)
 * ==================================================================== */
const CONFIG = {
  tts: false,          // true: 문장 완성 시 영어로 읽어 주기 (기본값). 학생이 메뉴에서 켜고 끌 수 있어요.
  sfx: true,           // 효과음 기본값
  bgm: false,          // 배경음 기본값
  hintsPerStage: 3,    // 스테이지당 힌트 횟수
  unlockAll: true      // 모든 스테이지를 처음부터 열어 두기
};

/* ====================================================================
 *  스테이지 / 문장 데이터
 *  - en:  [쉬움] 의미 단위(구)를 " / " 로 끊어 적으세요. 한 덩어리가 하나의 블록이 됩니다. (2~5단어 권장)
 *  - en2: [보통] 더 잘게 쪼갠 구. (생략하면 en의 긴 덩어리를 자동으로 반씩 나눕니다)
 *  - [어려움]은 단어 하나하나가 블록이 되므로 따로 적을 필요가 없습니다.
 *  - ko: 우리말 뜻 (화면 상단에 표시)
 *  - decoy: (선택) 함정 블록으로 쓰고 싶은 덩어리 배열
 * ==================================================================== */
const STAGES = [
  { id: 1, title: "Lesson 3-1", sub: "A Timeless Symbol of Korea · p.65–66", theme: 1 },
  { id: 2, title: "Lesson 3-2", sub: "A Timeless Symbol of Korea · p.66–68", theme: 2 },
  { id: 3, title: "Lesson 4-1", sub: "Looking to Nature for Help · p.85–86", theme: 3 },
  { id: 4, title: "Lesson 4-2", sub: "Looking to Nature for Help · p.86–88", theme: 4 }
];

const SENTENCES = [
  /* ---------- Lesson 3 (1) ---------- */
  { stage: 1, en: "Its story starts / with a girl / who meets a tiger.",
    en2: "Its story / starts / with a girl / who meets / a tiger.",
    ko: "그것의 이야기는 호랑이를 만난 한 소녀로부터 시작된다." },
  { stage: 1, en: "Her grandmother / knows the tiger / as well.",
    en2: "Her grandmother / knows / the tiger / as well.",
    ko: "그녀의 할머니 역시 그 호랑이를 알고 있다." },
  { stage: 1, en: "When her grandmother gets sick, / the girl makes a deal / with the tiger.",
    en2: "When her grandmother / gets sick, / the girl / makes a deal / with the tiger.",
    ko: "그녀의 할머니가 아프게 되자, 그 소녀는 그 호랑이와 거래를 한다." },
  { stage: 1, en: "It is called / “The Sun and the Moon,” / and it is about / a brother, a sister, / and a tiger.",
    en2: "It is called / “The Sun / and the Moon,” / and it is about / a brother, / a sister, / and a tiger.",
    ko: "그것은 ‘해님 달님’이라고 불리는데, 오빠와 여동생, 그리고 호랑이에 관한 내용이다." },
  { stage: 1, en: "Keller wanted / to revive / the public’s interest in tigers / by writing her own book.",
    en2: "Keller wanted / to revive / the public’s interest / in tigers / by writing / her own book.",
    ko: "Keller는 그녀 자신의 책을 씀으로써 호랑이에 대한 대중의 흥미를 되살리고 싶어 했다." },
  { stage: 1, en: "Long ago, / tigers were so abundant in Korea / that people often called the country / the “Land of Tigers.”",
    en2: "Long ago, / tigers were so abundant / in Korea / that people often called / the country / the “Land of Tigers.”",
    ko: "오래전, 한국에 호랑이가 매우 많아서 사람들은 종종 그 나라를 ‘호랑이의 땅’이라고 불렀다." },
  { stage: 1, en: "It is estimated / that tigers lived in Korea / for at least 100,000 years.",
    en2: "It is estimated / that tigers lived / in Korea / for at least / 100,000 years.",
    ko: "호랑이는 한국에 적어도 십만 년을 살았다고 추정된다." },
  { stage: 1, en: "The first appearance of a tiger / in Korean culture / dates back to / the rock art of the Bronze Age.",
    en2: "The first appearance / of a tiger / in Korean culture / dates back to / the rock art / of the Bronze Age.",
    ko: "한국 문화에서 호랑이의 첫 번째 등장은 청동기 시대의 바위 그림으로 거슬러 올라간다." },
  { stage: 1, en: "It depicts people / hunting various animals, / including tigers.",
    en2: "It depicts / people / hunting / various animals, / including tigers.",
    ko: "그것은 호랑이를 포함하여 다양한 동물을 사냥하는 사람들을 묘사한다." },

  /* ---------- Lesson 3 (2) ---------- */
  { stage: 2, en: "In fact, / approximately forty percent / of Korean folktales about animals / include a tiger.",
    en2: "In fact, / approximately / forty percent / of Korean folktales / about animals / include a tiger.",
    ko: "사실, 동물에 대한 한국 설화의 약 40%가 호랑이를 포함한다." },
  { stage: 2, en: "Since then, / tigers have appeared / in many aspects of Korean culture, / from legends to art / and musical instruments.",
    en2: "Since then, / tigers have appeared / in many aspects / of Korean culture, / from legends / to art / and musical instruments.",
    ko: "그때부터, 호랑이는 전설에서부터 미술과 악기에 이르기까지 한국 문화의 많은 측면에 등장해 왔다." },
  { stage: 2, en: "Because the baby stops crying, / the tiger mistakenly thinks / the gotgam is a very scary creature / and runs away.",
    en2: "Because the baby / stops crying, / the tiger / mistakenly thinks / the gotgam is / a very scary creature / and runs away.",
    ko: "그 아기가 울기를 멈추었기 때문에, 호랑이는 그 곶감이 매우 무서운 생명체라고 잘못 생각하고 달아난다." },
  { stage: 2, en: "They had respect / for tigers’ power and courage.",
    en2: "They had / respect / for tigers’ / power and courage.",
    ko: "그들은 호랑이의 힘과 용기에 대한 존경심이 있었다." },
  { stage: 2, en: "They may have made / tigers into foolish characters / in order to be less scared of them.",
    en2: "They may have made / tigers / into foolish characters / in order to / be less scared / of them.",
    ko: "그들은 호랑이를 덜 무서워하기 위해 호랑이를 어리석은 캐릭터로 만들었을지도 모른다." },
  { stage: 2, en: "Hodori was the mascot / for the Seoul Summer Olympics / in 1988.",
    en2: "Hodori was / the mascot / for / the Seoul Summer Olympics / in 1988.",
    ko: "호돌이는 1988년 서울 하계 올림픽의 마스코트였다." },
  { stage: 2, en: "White tigers / are considered / sacred guardians.",
    en2: "White tigers / are / considered / sacred guardians.",
    ko: "백호는 신성한 수호자로 여겨진다." },
  { stage: 2, en: "The song drew / worldwide attention, / and its video was viewed / millions of times online.",
    en2: "The song / drew / worldwide attention, / and its video / was viewed / millions of times / online.",
    ko: "그 노래는 세계적인 주목을 끌었고, 그것의 영상은 온라인에서 수백만 회 시청되었다." },
  { stage: 2, en: "Who can deny / that the tiger is / a symbol of Korea?",
    en2: "Who can deny / that the tiger / is / a symbol / of Korea?",
    ko: "호랑이가 한국의 상징이라는 점을 누가 부정할 수 있을까?" },

  /* ---------- Lesson 4 (1) ---------- */
  { stage: 3, en: "Our environment / is in trouble.",
    en2: "Our environment / is / in trouble.",
    ko: "우리의 환경은 곤경에 처해 있다." },
  { stage: 3, en: "With the planet becoming warmer, / sea levels are rising / and natural disasters / such as forest fires and floods / are increasing.",

  { stage: 3, en: "More and more waste / is also being produced.",
    en2: "More and more waste / is also / being produced.",
    ko: "또한 점점 더 많은 쓰레기가 생산되고 있다." },
  { stage: 3, en: "It is clear / that humans are / a major contributor / to the destruction of nature.",
    en2: "It is clear / that humans / are / a major contributor / to the destruction / of nature.",
    ko: "인간이 자연 파괴의 주요 원인 제공자라는 것은 분명하다." },
  { stage: 3, en: "Nature, however, / may have provided us / with solutions / to these problems.",
    en2: "Nature, however, / may have provided / us / with solutions / to these problems.",

  { stage: 3, en: "About fifty percent of plastic / is produced / for single-use products.",
    en2: "About fifty percent / of plastic / is produced / for / single-use products.",

  { stage: 3, en: "Recycling can help / reduce the amount of plastic / in our landfills.",
    en2: "Recycling / can help / reduce / the amount / of plastic / in our landfills.",

  { stage: 3, en: "However, / less than ten percent / of the world’s plastic waste / has been recycled / so far.",

  { stage: 3, en: "This puts / many marine species / in danger.",
    en2: "This puts / many marine / species / in danger.",
    ko: "이것은 많은 해양 종들을 위험에 빠뜨린다." },

  /* ---------- Lesson 4 (2) ---------- */
  { stage: 4, en: "Mealworms are / the larvae / of a certain species of beetle.",

const GLUE = [
  'a very scary creature', 'a major contributor', 'a certain species', 'a natural fuel', 'an eco-friendly and cost-effective way',
  'the public’s interest', 'the world’s plastic waste', 'the seoul summer olympics', 'the first appearance',

const ARTICLES = ['a', 'an', 'the'];
const nw = t => t.toLowerCase().replace(/[^a-z-]/g, '');
function wordTokens(text) {
  const w = text.split(/\s+/).filter(Boolean), n = w.map(nw), out = [];
  const glue = GLUE.map(g => g.split(' ').map(nw)).sort((a, b) => b.length - a.length);
  for (let i = 0; i < w.length;) {
    let k = 1;
    if (ARTICLES.includes(n[i])) {
      const m = glue.find(g => g.every((x, j) => n[i + j] === x));
      k = m ? m.length : Math.min(2, w.length - i);
    }
    out.push(w.slice(i, i + k).join(' ')); i += k;
  }
  return out;
}

  }

}

  const am = word.match(/^([^A-Za-z]*)(a|an|the)\s+(.+)$/i);   // "the tiger" → "a tiger" (관사 함정)

  const m = word.match(/^([^A-Za-z]*)([A-Za-z'’-]+)([^A-Za-z]*)$/);

  CONFUSE.forEach(g => { if (g.includes(low)) g.forEach(x => { if (x !== low) vs.add(x); }); });

  const same = shuffle(s.chunks.filter((c, j) => j !== i));
  let sameCnt = 0;
  for (const c of same) { if (sameCnt >= D.same || out.length >= want) break; if (take(c)) sameCnt++; }
  // 나머지: 같은 스테이지 다른 문장의 덩어리 (길이가 비슷한 것 우선)
  const wc = correct.split(' ').length;
  const pool = [];
  G.sents.forEach(o => { if (o !== s) o.chunks.forEach(c => pool.push(c)); });
  shuffle(pool).sort((a, b) => Math.abs(a.split(' ').length - wc) - Math.abs(b.split(' ').length - wc) + (Math.random() - .5) * 2)
    .forEach(c => { if (out.length < want) take(c); });
  // 부족하면 같은 문장 덩어리로 보충
  same.forEach(c => { if (out.length < want) take(c); });
  const slots = shuffle([0, 1, 2]).slice(0, out.length + 1);
  const texts = shuffle([{ t: correct, ok: true }, ...out.map(t => ({ t, ok: false }))]);
  return texts.map((x, k) => ({ text: x.t, correct: x.ok, slot: slots[k] }));
}

function spawnGate(extra = 0) {
  const s = curSent();
  const blocks = makeChoices(s, G.chunkIdx);
  // 폭 계산 (모든 블록 동일 폭)
  ctx.font = '800 21px "Segoe UI", system-ui, sans-serif';
  const maxW = Math.max(...blocks.map(b => ctx.measureText(b.text).width));
  let fs = 21;
  if (maxW > 330) fs = Math.max(14, Math.floor(21 * 330 / maxW));
  ctx.font = `800 ${fs}px "Segoe UI", system-ui, sans-serif`;
  const w = Math.max(G.diff === 'hard' ? 92 : 120, Math.ceil(Math.max(...blocks.map(b => ctx.measureText(b.text).width)) + 34));
  const D = DIFF[G.diff];
  const hasSpike = Math.random() < D.spike;
  const lead = hasSpike ? Math.max(D.lead, 2.6) : D.lead;   // 가시가 있으면 점프할 여유를 넉넉히
  const gx = PX + G.speed * (lead + extra);
  G.objs.push({ type: 'gate', x: gx, w, fs, blocks, done: false, hint: false, pickT: 0, pick: null });
  // 장애물
  if (hasSpike) {
    const k = (G.diff === 'hard' && Math.random() < .4) ? 2 : 1;
    let ox = Math.max(PX + 330, (PX + gx) / 2 - 40 + rand(-30, 30));
    if (gx - ox < 300) ox = gx - 300;
    G.objs.push({ type: 'spike', x: ox, w: 34 * k, k });
  }
}

/* ---------- 점수 / 이벤트 ---------- */
function onCorrect(gate, block) {
  G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  const mult = Math.min(5, 1 + Math.floor(G.combo / 3));
  const pts = 10 * mult; G.score += pts;
  addFloat(PX + 20, view.ground - G.h - 80, '+' + pts + (mult > 1 ? ' ×' + mult : ''), '#7cf59d');
  burst(PX + 20, view.ground - G.h - 30, '#ffe066', 14);
  sfx.good();
  G.chunkIdx++; G.hintShown = -1;
  const s = curSent();
  updateSlots(); updateHud();
  if (G.chunkIdx >= s.chunks.length) sentenceDone(); else spawnGate(0);
}
function onWrong(gate, block) {
  G.wrong++; G.combo = 0; G.lives--; G.missed.add(G.sentIdx);
  G.shake = .35;
  addFloat(PX + 20, view.ground - G.h - 80, '✗ 순서가 달라요', '#ff8c97');
  burst(PX + 20, view.ground - G.h - 30, '#ff5d6c', 12);
  sfx.bad();
  updateHud();
  if (G.lives <= 0) return gameOver();
  spawnGate(0);
}
function onMiss() {
  G.combo = 0; updateHud();
  addFloat(PX + 60, view.ground - 150, '놓쳤어요! 점프로 블록을 잡아요', '#ffd978');
  spawnGate(0);
}
function onHit() {
  G.lives--; G.combo = 0; G.invuln = 1.5; G.shake = .35;
  addFloat(PX + 20, view.ground - G.h - 80, '아야! 장애물', '#ff8c97');
  burst(PX, view.ground - 20, '#ff5d6c', 10);
  sfx.hit(); updateHud();
  if (G.lives <= 0) gameOver();
}
function sentenceDone() {
  const s = curSent();
  const bonus = G.hintUsedSent ? 0 : 50;
  G.score += bonus; G.doneIds.push(s.id);
  store.d.done[s.id] = 1; store.save();
  sfx.done();
  if (S.tts) speak(s.full);
  const t = $('#toast'); t.classList.remove('warn');
  t.innerHTML = `<div class="en">✔ ${esc(s.full)}</div><div class="pt">${bonus ? '문장 완성 +' + bonus : '힌트를 써서 보너스 없음'}</div>`;
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2300);
  updateHud();
  G.phase = 'between'; G.wait = 2.2;
  G.finishing = (G.sentIdx >= G.sents.length - 1);
}
function nextSentence() {
  if (G.finishing) return stageClear();
  G.sentIdx++; G.phase = 'run';
  beginSentence(false);
}

/* ---------- 결과 화면 ---------- */
function starsFor() {
  const tot = G.correct + G.wrong, acc = tot ? G.correct / tot : 1;
  return { acc, stars: (acc >= .9 && G.lives === G.maxLives) ? 3 : (acc >= .7 ? 2 : 1) };
}
const starStr = n => `<span class="star">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`;
function reviewList(set) {
  const idx = [...set].sort((a, b) => a - b);

  return idx.map(i => { const s = G.sents[i]; return `<div class="rv"><div class="tx"><div class="en">${esc(s.full)}</div><div class="ko">${esc(s.ko)}</div></div><button class="say" data-say="${esc(s.full)}">🔊</button></div>`; }).join('');
}
function stageClear() {

    </div>

function gameOver() {

  sfx.lose();
  $('#resultBox').innerHTML = `
    <h2>💥 게임 오버</h2>

/* ---------- 힌트 ---------- */
function useHint() {
  if (state !== 'play' || !G || G.phase !== 'run' || G.hints <= 0) return;
  const gate = G.objs.find(o => o.type === 'gate' && !o.done);
  if (!gate || gate.hint) return;
  G.hints--; gate.hint = true; G.hintShown = G.chunkIdx; G.hintUsedSent = true;
  sfx.hint(); updateSlots(); updateHud();
}

/* ---------- 입력 ---------- */
function jump() {
  if (state !== 'play' || !G) return;
  if (G.jumps < 2) { G.vy = JUMP_V; G.jumps++; G.h = Math.max(G.h, 0.01); sfx.jump(); }
}
document.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  ensureAudio();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { jump(); }
  else if (e.code === 'KeyH') useHint();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') { S.sfx = !S.sfx; saveSettings(); renderToggles(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });
$('#stagewrap').addEventListener('pointerdown', e => {
  if (e.target.closest('.screen.on')) return;
  ensureAudio(); jump();
});
window.addEventListener('blur', () => { if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

function togglePause() {
  if (state === 'play') { state = 'pause'; renderToggles(); showScreen('sPause'); }
  else if (state === 'pause') { state = 'play'; hideScreens(); }
}

/* ---------- HUD ---------- */
function updateHud() {
  if (!G) { $('#hLives').textContent = ''; $('#hScore').textContent = 0; $('#hCombo').textContent = ''; $('#hHint').textContent = CONFIG.hintsPerStage; return; }
  $('#hLives').textContent = '♥'.repeat(Math.max(0, G.lives)) + '♡'.repeat(Math.max(0, G.maxLives - G.lives));
  $('#hScore').textContent = G.score;
  const mult = Math.min(5, 1 + Math.floor(G.combo / 3));
  $('#hCombo').textContent = G.combo >= 2 ? `🔥 ${G.combo} 콤보 ×${mult}` : '';
  $('#hHint').textContent = G.hints;
  $('#bHint').disabled = G.hints <= 0;
  $('#hStage').textContent = `${G.stage.title} · 문장 ${Math.min(G.sentIdx + 1, G.sents.length)}/${G.sents.length}`;
}
function hintText(c) { return c.split(' ').map(w => w.replace(/^[^A-Za-z0-9]*/, '').charAt(0) + '…').join(' '); }
function updateSlots() {
  const s = curSent(); let h = '';
  s.chunks.forEach((c, i) => {
    if (i < G.chunkIdx) h += `<span class="slot ok">${esc(c)}</span>`;
    else {
      const wc = c.split(' ').length;
      const txt = (i === G.chunkIdx && G.hintShown === i) ? esc(hintText(c)) : '';
      h += `<span class="slot ${i === G.chunkIdx ? 'cur' : ''}" style="min-width:${30 + wc * 32}px">${txt}</span>`;
    }
  });
  $('#hSlots').innerHTML = h;
}
$('#bHint').onclick = e => { useHint(); e.currentTarget.blur(); };
$('#bPause').onclick = e => { togglePause(); e.currentTarget.blur(); };
$('#bSound').onclick = e => { ensureAudio(); S.sfx = !S.sfx; saveSettings(); renderToggles(); e.currentTarget.blur(); };

/* ---------- 파티클 / 플로터 ---------- */
function burst(x, y, color, n) { for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rand(-160, 160), vy: rand(-260, 60), life: rand(.4, .8), t: 0, c: color, s: rand(3, 6) }); }
function addFloat(x, y, text, color) { G.floats.push({ x, y, text, color, t: 0 }); }

/* ---------- 업데이트 ---------- */
function update(dt) {
  const g = G; g.t += dt;
  g.speed = DIFF[g.diff].speed * (1 + 0.02 * g.sentIdx);
  const mv = g.speed * dt;
  g.dist += mv;
  g.objs.forEach(o => o.x -= mv);

  // 카운트다운 / 문장 사이 대기
  if (g.phase === 'countdown') {
    g.cd -= dt;
    const n = Math.ceil(g.cd - 0.4);
    if (n !== g.cdLast) {
      g.cdLast = n;
      $('#center').innerHTML = n > 0 ? `<div class="big">${n}</div><div class="small">Space 또는 ↑ 로 점프! 공중에서 한 번 더 누르면 더 높이 올라가요</div>` : `<div class="big">GO!</div>`;
      if (n > 0) sfx.tick();
    }
    if (g.cd <= 0.4 && g.phase === 'countdown') { /* GO 표시 */ }
    if (g.cd <= 0) { g.phase = 'run'; $('#center').innerHTML = ''; beginSentence(true); }
  } else if (g.phase === 'between') {
    g.wait -= dt; if (g.wait <= 0) nextSentence();
  }

  // 점프 물리
  if (g.h > 0 || g.vy > 0) {
    g.h += g.vy * dt; g.vy -= GRAV * dt;
    if (g.h <= 0) { g.h = 0; g.vy = 0; g.jumps = 0; }
  }
  if (g.invuln > 0) g.invuln -= dt;
  if (g.shake > 0) g.shake -= dt;

  // 충돌
  const pl = PX - 14, pr = PX + 14, pb = g.h, pt = g.h + 50;
  for (const o of g.objs) {
    if (o.type === 'gate') {
      if (o.done) { o.pickT += dt; continue; }
      if (g.phase === 'run' || g.phase === 'between') {
        if (o.x < pr && o.x + o.w > pl) {
          for (const b of o.blocks) {
            const bb = SLOT_H[b.slot], bt = bb + BH;
            if (pt > bb && pb < bt) {
              o.done = true; o.pick = b;
              if (b.correct) onCorrect(o, b); else onWrong(o, b);
              break;
            }
          }
          if (state !== 'play') return;
        } else if (o.x + o.w < pl) {
          o.done = true; o.pick = null; o.pickT = 1;
          if (g.phase === 'run') onMiss();
        }
      }
    } else if (o.type === 'spike') {
      if (g.invuln <= 0 && o.x + 4 < pr - 2 && o.x + o.w - 4 > pl + 2 && pb < 28) {
        o.x -= 0; onHit(); if (state !== 'play') return;
      }
    }
  }
  g.objs = g.objs.filter(o => o.x + (o.w || 0) > -400 && !(o.type === 'gate' && o.done && o.pickT > 1));

  // 파티클 / 플로터
  g.parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; });
  g.parts = g.parts.filter(p => p.t < p.life);
  g.floats.forEach(f => { f.t += dt; f.y -= 34 * dt; });
  g.floats = g.floats.filter(f => f.t < 1.3);
}

/* ---------- 그리기 ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
let idleDist = 0;
function draw(dist, g, t) {
  const T = THEMES[g ? g.theme : 1];
  const k = view.dpr * view.scale;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (g && g.shake > 0) ctx.translate(rand(-5, 5) * g.shake * 3, rand(-4, 4) * g.shake * 3);
  if (!bg) buildBackground();
  const gy = view.ground;
  ctx.drawImage(bg.sky, 0, 0, view.W, view.H);
  // 구름
  ctx.fillStyle = T.cloud;
  bg.clouds.forEach(c => {
    const x = ((c.x - dist * c.v) % (view.W + 200) + view.W + 200) % (view.W + 200) - 100;
    ctx.beginPath(); ctx.ellipse(x, c.y, 38 * c.s, 16 * c.s, 0, 0, 7); ctx.ellipse(x + 24 * c.s, c.y - 9 * c.s, 26 * c.s, 15 * c.s, 0, 0, 7); ctx.ellipse(x - 22 * c.s, c.y - 5 * c.s, 22 * c.s, 12 * c.s, 0, 0, 7); ctx.fill();
  });
  // 산
  [[bg.far, .12], [bg.near, .3]].forEach(([img, f]) => {
    let x0 = -((dist * f) % STRIP);
    for (let x = x0; x < view.W; x += STRIP) ctx.drawImage(img, x, 0, STRIP, view.H);
  });
  // 땅
  ctx.fillStyle = T.ground; ctx.fillRect(0, gy, view.W, view.H - gy);
  ctx.fillStyle = T.top; ctx.fillRect(0, gy, view.W, 9);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  const off = dist % 90;
  for (let x = -off; x < view.W; x += 90) ctx.fillRect(x, gy + 28, 46, 6);
  for (let x = -off + 45; x < view.W; x += 90) ctx.fillRect(x, gy + 50, 30, 5);

  if (g) {
    // 장애물 + 게이트
    for (const o of g.objs) {
      if (o.type === 'spike') drawSpike(o);
      else drawGate(o, g, t);
    }
    drawPlayer(g, t);
    // 파티클
    g.parts.forEach(p => { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); });
    ctx.globalAlpha = 1;
    ctx.font = '900 22px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
    g.floats.forEach(f => { ctx.globalAlpha = Math.max(0, 1 - f.t / 1.3); ctx.lineWidth = 5; ctx.strokeStyle = '#000a'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); });
    ctx.globalAlpha = 1;
    if (g.invuln > 0 && Math.floor(g.invuln * 12) % 2) { /* 깜빡임은 drawPlayer에서 */ }
  } else {
    drawPlayer({ h: 0, jumps: 0, invuln: 0 }, t);
  }
}
function drawSpike(o) {
  const gy = view.ground;
  for (let i = 0; i < o.k; i++) {
    const x = o.x + i * 34;
    ctx.fillStyle = '#d9dbe8'; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + 17, gy - 36); ctx.lineTo(x + 34, gy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ff5d6c'; ctx.lineWidth = 3; ctx.stroke();
  }
}
function drawGate(o, g, t) {
  const gy = view.ground;
  let alpha = 1;
  if (o.done) alpha = Math.max(0, 1 - o.pickT / .7);
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  // 게이트 배경 기둥
  ctx.fillStyle = 'rgba(255,255,255,.10)'; rr(o.x - 8, gy - 300, o.w + 16, 300, 14); ctx.fill();
  ctx.setLineDash([7, 7]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  for (const b of o.blocks) {
    const y = gy - SLOT_H[b.slot] - BH;
    let fill = '#fffdf3', stroke = '#3b2f63', txt = '#2a2350', dy = 0, a = alpha;
    if (o.done) {
      if (o.pick === b) { fill = b.correct ? '#b9f5c6' : '#ffc4c9'; stroke = b.correct ? '#1f9d4c' : '#d33a4a'; dy = -Math.min(40, o.pickT * 90); a = Math.max(0, 1 - o.pickT / .8); }
      else a = alpha * .35;
    }
    ctx.globalAlpha = a;
    if (o.hint && !o.done && b.correct) {
      const p = .5 + .5 * Math.sin(t * 9);
      ctx.globalAlpha = a * (.45 + .45 * p); ctx.fillStyle = '#ffe24a'; rr(o.x - 7, y - 7, o.w + 14, BH + 14, 16); ctx.fill(); ctx.globalAlpha = a;
    }
    rr(o.x, y + dy, o.w, BH, 11); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke();
    ctx.font = `800 ${o.fs}px "Segoe UI", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = txt; ctx.fillText(b.text, o.x + o.w / 2, y + dy + BH / 2 + 1);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1;
}
function drawPlayer(g, t) {
  if (g.invuln > 0 && Math.floor(g.invuln * 14) % 2) return;
  const fy = view.ground - g.h, air = g.h > 0;
  const ph = t * 16;
  ctx.save(); ctx.translate(PX, fy);
  // 그림자
  if (air) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, g.h, Math.max(8, 18 - g.h / 14), 4, 0, 0, 7); ctx.fill(); ctx.translate(0, 0); }
  // 꼬리
  ctx.strokeStyle = '#f08a1c'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14, -22); ctx.quadraticCurveTo(-30, -26 + Math.sin(ph) * 5, -26, -40); ctx.stroke();
  // 다리
  ctx.strokeStyle = '#d9731a'; ctx.lineWidth = 7;
  const a = air ? .6 : Math.sin(ph) * .9;
  ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-6 + Math.sin(a) * 11, -1 - (air ? 4 : 0)); ctx.moveTo(8, -12); ctx.lineTo(8 - Math.sin(a) * 11, -1 - (air ? 4 : 0)); ctx.stroke();
  // 몸
  ctx.fillStyle = '#ffa42b'; ctx.beginPath(); ctx.ellipse(0, -24, 17, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a3a05'; ctx.fillRect(-9, -36, 4, 10); ctx.fillRect(-1, -37, 4, 12); ctx.fillRect(7, -35, 4, 9);
  // 머리
  ctx.fillStyle = '#ffb53f'; ctx.beginPath(); ctx.arc(9, -41, 13, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb53f'; ctx.beginPath(); ctx.arc(1, -52, 5, 0, 7); ctx.arc(17, -52, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3d8'; ctx.beginPath(); ctx.ellipse(14, -37, 7, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a3a05'; ctx.fillRect(7, -52, 3, 6);
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(12, -44, 2.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(19, -39, 2, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- 화면 전환 / 메뉴 ---------- */
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function hideScreens() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); }
function toMenu() {
  state = 'menu'; G = null; $('#center').innerHTML = ''; $('#toast').classList.remove('show');
  $('#hStage').textContent = 'Sentence Runner'; setKo(''); $('#hSlots').innerHTML = ''; updateHud();
  buildBackground(1); renderMenu(); showScreen('sMenu');
}
function renderToggles() {
  const mk = () => `
    <button data-t="sfx" class="${S.sfx ? 'on' : ''}">🔊 효과음 ${S.sfx ? 'ON' : 'OFF'}</button>
    <button data-t="bgm" class="${S.bgm ? 'on' : ''}">🎵 배경음 ${S.bgm ? 'ON' : 'OFF'}</button>
    <button data-t="tts" class="${S.tts ? 'on' : ''}">🗣 문장 읽어주기 ${S.tts ? 'ON' : 'OFF'}</button>`;
  $('#menuToggles').innerHTML = mk(); $('#pauseToggles').innerHTML = mk();
  $('#bSound').textContent = S.sfx ? '🔊' : '🔇';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { ensureAudio(); S[t.dataset.t] = !S[t.dataset.t]; saveSettings(); renderToggles(); return; }
  const sy = e.target.closest('[data-say]');
  if (sy) { speak(sy.dataset.say); }
});
function renderMenu() {
  $('#diffSeg').innerHTML = Object.entries(DIFF).map(([k, d]) => `<button data-d="${k}" class="${S.diff === k ? 'on' : ''}">${d.label}</button>`).join('');
  $('#diffDesc').textContent = DIFF[S.diff].desc;
  $('#diffSeg').querySelectorAll('button').forEach(b => b.onclick = () => { S.diff = b.dataset.d; saveSettings(); renderMenu(); });
  $('#stageCards').innerHTML = STAGES.map(st => {
    const best = store.d.best[st.id + '-' + S.diff];
    const n = BY_STAGE[st.id].length;
    return `<button class="card" data-s="${st.id}"><div class="t">${esc(st.title)}</div><div class="d">${esc(st.sub)}</div>
      <div class="s"><span>${n}문장</span><span>${best ? starStr(best.stars) + ' ' + best.score : '<span style="color:#8d86cf">기록 없음</span>'}</span></div></button>`;
  }).join('');
  $('#stageCards').querySelectorAll('.card').forEach(c => c.onclick = () => startStage(+c.dataset.s, false));
  $('#howBox').innerHTML = `<b>🎮 게임 방법</b><br>
    ① 위에 나온 <b>우리말 뜻</b>에 맞게 영어 문장을 <b>앞에서부터 순서대로</b> 완성해요.<br>
    ② 캐릭터는 자동으로 달려요. <kbd>Space</kbd> 또는 <kbd>↑</kbd> 로 <b>점프</b>! 공중에서 <b>한 번 더</b> 누르면 더 높이 올라가요.<br>
    ③ 앞에 나타나는 <b>블록 중 다음에 올 덩어리</b>를 점프로 잡아요. <b>낮은 블록=달리기, 중간=점프, 높은 블록=두 번 점프</b><br>
    ④ 틀린 블록이나 가시에 부딪히면 ♥가 줄어요. ♥가 0이 되면 게임 오버! 💡힌트(<kbd>H</kbd>)는 스테이지당 ${CONFIG.hintsPerStage}번.`;
  renderToggles();
}
$('#bLib').onclick = () => {
  let h = '';
  STAGES.forEach(st => {
    h += `<div class="libh">${esc(st.title)} · ${esc(st.sub)}</div>`;
    BY_STAGE[st.id].forEach(s => {
      h += store.d.done[s.id]
        ? `<div class="rv"><div class="tx"><div class="en">${esc(s.full)}</div><div class="ko">${esc(s.ko)}</div></div><button class="say" data-say="${esc(s.full)}">🔊</button></div>`
        : `<div class="rv"><div class="tx"><div class="lk">🔒 아직 완성하지 못한 문장</div></div></div>`;
    });
  });
  $('#libList').innerHTML = h; state = 'lib'; showScreen('sLib');
};
$('#libBack').onclick = () => { state = 'menu'; showScreen('sMenu'); };
$('#pResume').onclick = togglePause;
$('#pRestart').onclick = () => startStage(G.stage.id, false);
$('#pMenu').onclick = toMenu;

/* ---------- 메인 루프 ---------- */
let last = 0, animT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts;
  if (state === 'play' && G) { update(dt); animT += dt; draw(G.dist, G, animT); }
  else if (G) { draw(G.dist, G, animT); }
  else { idleDist += 110 * dt; animT += dt; draw(idleDist, null, animT); }
}

/* 테스트/디버그용 훅 */
window.__SR = { get G() { return G; }, get state() { return state; }, jump, startStage, PX, SLOT_H, chunkFor, confusables, wordTokens };

resize(); renderMenu(); updateHud();
requestAnimationFrame(frame);
})();
</script>
